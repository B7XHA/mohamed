<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 صفحة حبيبتي 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 10% 30%, #2a001a, #0d0012);
    font-family: 'Cairo', sans-serif;
    color: #fff6f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #ff3b6f, #4a0020);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
    gap: 30px;
    transition: opacity 0.4s ease;
  }

  #startImg {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ff99cc;
    box-shadow: 0 0 40px #ff4d94;
  }

  #startBtn {
    padding: 18px 48px;
    font-size: 28px;
    font-weight: bold;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #ffb347, #ff6b6b);
    border: none;
    border-radius: 60px;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 30px #ff4080;
    transition: transform 0.2s;
  }

  #startBtn:hover { transform: scale(1.02); }

  .glass-container {
    max-width: 550px;
    width: 100%;
    background: rgba(25, 5, 30, 0.55);
    backdrop-filter: blur(14px);
    border-radius: 65px;
    padding: 25px 20px 35px;
    text-align: center;
    border: 1px solid rgba(255, 100, 150, 0.5);
  }

  .main-img {
    width: 100%;
    max-width: 380px;
    border-radius: 58px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.4), 0 0 0 3px #ff99cc;
    margin-bottom: 12px;
  }

  .message-area {
    background: rgba(0,0,0,0.3);
    border-radius: 48px;
    padding: 18px 15px;
    margin: 15px 0 12px;
  }

  #typedText {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.5;
    color: #fff3e6;
    text-shadow: 0 2px 5px #ff3388;
    white-space: pre-line;
  }

  .counter-love {
    background: linear-gradient(120deg, #ff3b6f30, #b8004b30);
    border-radius: 50px;
    padding: 12px 8px;
    margin: 12px 0 15px;
    font-size: 1.2rem;
    font-weight: bold;
  }

  .video-wrapper {
    margin: 12px 0 5px;
    display: flex;
    justify-content: center;
  }

  .video-iframe {
    width: 90%;
    max-width: 330px;
    aspect-ratio: 9 / 16;
    border-radius: 38px;
    box-shadow: 0 18px 30px rgba(0,0,0,0.6), 0 0 0 3px #ff77aa;
    border: none;
  }

  .falling-heart {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 2000;
    font-size: 28px;
    filter: drop-shadow(0 0 5px #ff2e5e);
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .footer-note {
    font-size: 12px;
    margin-top: 20px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div id="startScreen">
  <img src="image.jpg" id="startImg" alt="صورتي" onerror="this.src='https://placehold.co/200x200/ff3388/white?text=❤️'">
  <button id="startBtn">✨ اضغطي هنا ✨</button>
</div>

<div class="glass-container" style="display: none;" id="mainContent">
  <!-- صورة رئيسية -->
  <img src="image.jpg" class="main-img" alt="حبيبتي" onerror="this.src='https://placehold.co/400x400/ff3388/white?text=💕'">
  
  <div class="message-area">
    <div id="typedText"></div>
  </div>

  <div class="counter-love" id="loveCounter">💞 0 يوم | 0 ساعة | 0 دقيقة | 0 ثانية</div>

  <!-- فيديو من YouTube -->
  <div class="video-wrapper">
    <iframe class="video-iframe" 
      src="https://www.youtube.com/embed/JBg7UkXFmcU" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin" 
      allowfullscreen>
    </iframe>
  </div>
  <div class="footer-note">🌹 كل لحظة معاكِ أغلى من أي حاجة 🌹</div>
</div>

<script>
(function() {
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const mainContent = document.getElementById('mainContent');
    const typedDiv = document.getElementById('typedText');
    const counterDiv = document.getElementById('loveCounter');

    const loveMessage = `💗 كل سنه وانتي طيبه يا قلبي و كل سنه وانتي معايا و بتحلي ايامي ❤️\nمهما قولت كلام مش هقدر اوصف الي في قلبي بس كل الي اقدر اقولو اني بحبك و مقدرش استغنى عنك 💖`;
    let charIndex = 0;
    let typingInterval = null;

    function startTypingEffect() {
        typedDiv.innerHTML = '';
        charIndex = 0;
        if (typingInterval) clearTimeout(typingInterval);
        function typeNextChar() {
            if (charIndex < loveMessage.length) {
                let currentChar = loveMessage.charAt(charIndex);
                if (currentChar === '\n') {
                    typedDiv.innerHTML += '<br>';
                } else {
                    typedDiv.innerHTML += currentChar;
                }
                charIndex++;
                typingInterval = setTimeout(typeNextChar, 45);
            }
        }
        typeNextChar();
    }

    function initCounterAndUpdate() {
        const startDate = new Date(2025, 6, 2);
        function updateCounter() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) {
                counterDiv.innerHTML = `💖 في انتظار 2 يونيو 2025 💖`;
                return;
            }
            const totalSeconds = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            counterDiv.innerHTML = `💖 ${days}  | ${hours}  | ${minutes}  | ${seconds}  💖`;
        }
        updateCounter();
        setInterval(updateCounter, 1000);
    }

    let heartsInterval = null;
    function startFallingHearts() {
        if (heartsInterval) clearInterval(heartsInterval);
        heartsInterval = setInterval(() => {
            const heartDiv = document.createElement('div');
            heartDiv.classList.add('falling-heart');
            const heartSymbols = ['❤️', '💖', '💗', '💓', '💕', '💞', '💘', '💝', '❤️‍🔥'];
            heartDiv.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heartDiv.style.fontSize = (Math.floor(Math.random() * 30) + 24) + 'px';
            heartDiv.style.left = Math.random() * 100 + '%';
            const duration = (Math.random() * 3.5 + 2.2).toFixed(2);
            heartDiv.style.animation = `fall ${duration}s linear forwards`;
            document.body.appendChild(heartDiv);
            heartDiv.addEventListener('animationend', () => heartDiv.remove());
        }, 150);
    }

    let isStarted = false;
    function startFullExperience() {
        if (isStarted) return;
        isStarted = true;

        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.display = 'none';
            mainContent.style.display = 'block';
        }, 400);

        startTypingEffect();
        initCounterAndUpdate();
        startFallingHearts();
    }

    if (startBtn) {
        startBtn.addEventListener('click', (e) => {
            e.preventDefault();
            startFullExperience();
        });
    }
})();
</script>
</body>
</html>
