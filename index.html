<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- خط عربي -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<title>💖</title>

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #1a001f, #330033, #660033);
    overflow-x: hidden;
}

/* البداية */
#startScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #ff0066, #1a001f);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

#startBtn {
    padding: 20px 50px;
    font-size: 22px;
    background: linear-gradient(45deg, #ff4d94, #ff99cc);
    border-radius: 30px;
    border: none;
    color: white;
}

/* القلوب */
.heart {
    position: fixed;
    top: -50px;
    width: 25px;
    height: 25px;
    background: url('heart.png') center/contain no-repeat;
    animation: fall linear forwards;
    opacity: 0.9;
}

@keyframes fall {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
}

/* الكارد */
.container {
    background: rgba(0,0,0,0.5);
    margin: 20px;
    border-radius: 30px;
    padding: 20px;
    backdrop-filter: blur(12px);
}

/* الصورة قلب ❤️ */
.main-img {
    width: 100%;
    max-width: 350px;
    margin: auto;
    display: block;
    filter: drop-shadow(0 0 20px #ff4d94);

    /* شكل قلب */
    clip-path: path("M 150 270 C 20 150, 20 0, 150 100 C 280 0, 280 150, 150 270 Z");
}

/* النص */
#typedText {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.8;
}

/* العداد */
.counter {
    margin-top: 15px;
    font-size: 20px;
    color: #ff99cc;
    border-top: 1px solid #ff66b2;
    padding-top: 10px;
}

/* الريكورد */
.voice-box {
    margin-top: 20px;
    background: linear-gradient(45deg, #ff4d94, #ff99cc);
    border-radius: 40px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.play-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: white;
    color: #ff4d94;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
}

/* الفيديو */
.video-box {
    margin-top: 25px;
    display: flex;
    justify-content: center;
}

video {
    width: 90%;
    max-width: 350px;
    aspect-ratio: 9/16;
    object-fit: cover;
    border-radius: 25px;
}
</style>
</head>

<body>

<div id="startScreen">
    <button id="startBtn">اضغط هنا ❤️</button>
</div>

<audio id="bgMusic" src="vice1.mp3" loop></audio>
<audio id="voice" src="vice2.mp3"></audio>

<div class="container">

<img src="image.jpg" class="main-img">

<div id="typedText"></div>

<div class="counter" id="counter"></div>

<div class="voice-box">
    <div class="play-btn" onclick="playVoice()">▶</div>
</div>

<div class="video-box">
<video controls>
    <source src="video1.mp4">
</video>
</div>

</div>

<script>

// تشغيل
document.getElementById("startBtn").onclick = () => {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("bgMusic").play();
    createHearts();
    typeText();
    startCounter();
}

// كتابة
let text = `كل يوم معاكي هو أجمل حاجة في حياتي ❤️`;

let i = 0;
function typeText() {
    if (i < text.length) {
        document.getElementById("typedText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeText, 50);
    }
}

// عداد
function startCounter() {
    let startDate = new Date("2025-06-02");

    setInterval(() => {
        let now = new Date();
        let diff = now - startDate;

        let d = Math.floor(diff / (1000*60*60*24));
        let h = Math.floor((diff / (1000*60*60)) % 24);
        let m = Math.floor((diff / (1000*60)) % 60);
        let s = Math.floor((diff / 1000) % 60);

        document.getElementById("counter").innerHTML =
        `💖 ${d} يوم | ${h} ساعة | ${m} دقيقة | ${s} ثانية`;
    }, 1000);
}

// قلوب
function createHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random()*3+3)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    },150);
}

// ريكورد
function playVoice(){
    let bg=document.getElementById("bgMusic");
    let voice=document.getElementById("voice");

    bg.volume=0.2;
    voice.play();

    voice.onended=()=>{bg.volume=1;}
}

</script>

</body>
</html>
