here<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖</title>

<style>
body {
    margin: 0;
    font-family: 'Cairo', sans-serif;
    color: white;
    text-align: center;
    background: linear-gradient(135deg, #1a001f, #330033, #660033);
}

/* البداية */
#startScreen {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle, #ff0066, #1a001f);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
}

#startBtn {
    padding: 20px 50px;
    font-size: 22px;
    background: linear-gradient(45deg, #ff4d94, #ff99cc);
    border-radius: 30px;
    border: none;
    color: white;
}

/* القلوب */
.heart {
    position: fixed;
    top: -50px;
    width: 30px;
    height: 30px;
    background: url('heart.png') center/contain no-repeat;
    animation: fall linear forwards;
}

@keyframes fall {
    0% { transform: translateX(0); }
    100% { transform: translateX(80px) translateY(110vh); }
}

/* الكارت */
.container {
    background: rgba(0,0,0,0.5);
    margin: 20px;
    border-radius: 30px;
    padding: 20px;
    backdrop-filter: blur(12px);
}

/* الصورة */
.main-img {
    width: 100%;
    max-width: 400px;
    border-radius: 40px;
    box-shadow: 0 0 30px #ff66b2;
}

/* النص */
#typedText {
    margin-top: 20px;
    font-size: 18px;
    line-height: 1.8;
}

/* العداد */
.counter {
    margin-top: 15px;
    font-size: 20px;
    color: #ff99cc;
    border-top: 1px solid #ff66b2;
    padding-top: 10px;
}

/* الريكورد */
.voice-box {
    margin-top: 20px;
    background: linear-gradient(45deg, #ff4d94, #ff99cc);
    border-radius: 40px;
    padding: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.play-btn {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: white;
    color: #ff4d94;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    font-weight: bold;
}

.wave {
    flex: 1;
    height: 6px;
    border-radius: 10px;
    background: repeating-linear-gradient(
        90deg,
        white,
        white 5px,
        #ff4d94 5px,
        #ff4d94 10px
    );
}

/* الفيديو تيك توك */
.video-box {
    margin-top: 25px;
    display: flex;
    justify-content: center;
}

video {
    width: 90%;
    max-width: 350px;
    aspect-ratio: 9/16;
    object-fit: cover;
    border-radius: 25px;
    box-shadow: 0 0 25px #ff4d94;
}
</style>
</head>

<body>

<div id="startScreen">
    <button id="startBtn">اضغط هنا ❤️</button>
</div>

<audio id="bgMusic" src="vice1.mp3" loop></audio>
<audio id="voice" src="vice2.mp3"></audio>

<div class="container">

<img src="image.jpg" class="main-img">

<div id="typedText"></div>

<div class="counter" id="counter"></div>

<div class="voice-box">
    <div class="play-btn" onclick="playVoice()">▶</div>
    <div class="wave"></div>
</div>

<div class="video-box">
<video controls>
    <source src="video1.mp4">
</video>
</div>

</div>

<script>

// تشغيل
document.getElementById("startBtn").onclick = () => {
    document.getElementById("startScreen").style.display = "none";
    document.getElementById("bgMusic").play();
    createHearts();
    typeText();
    startCounter();
}

// كتابة
let text = `احنا متكلمين من يوم 2/6/2025 ❤️
وبعد بكره هنكمل عشر شهور 💕
كل يوم معاكي بيعدي كأنه أجمل حاجة في حياتي 💖`;

let i = 0;
function typeText() {
    if (i < text.length) {
        document.getElementById("typedText").innerHTML += text.charAt(i);
        i++;
        setTimeout(typeText, 40);
    }
}

// عداد بالثواني
function startCounter() {
    let startDate = new Date("2025-06-02");

    setInterval(() => {
        let now = new Date();
        let diff = now - startDate;

        let days = Math.floor(diff / (1000*60*60*24));
        let hours = Math.floor((diff / (1000*60*60)) % 24);
        let minutes = Math.floor((diff / (1000*60)) % 60);
        let seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("counter").innerHTML =
        `💖 ${days} يوم | ${hours} ساعة | ${minutes} دقيقة | ${seconds} ثانية`;
    }, 1000);
}

// قلوب
function createHearts() {
    setInterval(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random()*3+3)+"s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    },200);
}

// ضغط
document.addEventListener("click", e => {
    for(let i=0;i<4;i++){
        let heart = document.createElement("div");
        heart.className="heart";
        heart.style.left=e.clientX+"px";
        heart.style.top=e.clientY+"px";
        heart.style.animationDuration="2s";
        document.body.appendChild(heart);
        setTimeout(()=>heart.remove(),2000);
    }
});

// ريكورد
function playVoice(){
    let bg=document.getElementById("bgMusic");
    let voice=document.getElementById("voice");

    bg.volume=0.2;
    voice.play();

    voice.onended=()=>{bg.volume=1;}
}

</script>

</body>
  </html>
