<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💖 صفحة حبيبتي 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    min-height: 100vh;
    background: radial-gradient(circle at 10% 30%, #2a001a, #0d0012);
    font-family: 'Cairo', sans-serif;
    color: #fff6f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow-x: hidden;
  }

  #startScreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, #ff3b6f, #4a0020);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    flex-direction: column;
    gap: 30px;
  }

  #startImg {
    width: 200px;
    height: 200px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ff99cc;
    box-shadow: 0 0 40px #ff4d94;
  }

  #startBtn {
    padding: 18px 48px;
    font-size: 28px;
    font-weight: bold;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #ffb347, #ff6b6b);
    border: none;
    border-radius: 60px;
    color: white;
    cursor: pointer;
    box-shadow: 0 0 30px #ff4080;
  }

  .glass-container {
    max-width: 550px;
    width: 100%;
    background: rgba(25, 5, 30, 0.55);
    backdrop-filter: blur(14px);
    border-radius: 65px;
    padding: 25px 20px 35px;
    text-align: center;
    border: 1px solid rgba(255, 100, 150, 0.5);
  }

  .main-img {
    width: 100%;
    max-width: 380px;
    border-radius: 58px;
    box-shadow: 0 20px 35px rgba(0,0,0,0.4), 0 0 0 3px #ff99cc;
    margin-bottom: 12px;
  }

  .message-area {
    background: rgba(0,0,0,0.3);
    border-radius: 48px;
    padding: 18px 15px;
    margin: 15px 0 12px;
  }

  #typedText {
    font-size: 1.4rem;
    font-weight: 700;
    line-height: 1.5;
    color: #fff3e6;
    text-shadow: 0 2px 5px #ff3388;
  }

  .counter-love {
    background: linear-gradient(120deg, #ff3b6f30, #b8004b30);
    border-radius: 50px;
    padding: 12px 8px;
    margin: 12px 0 15px;
    font-size: 1.2rem;
    font-weight: bold;
  }

  .voice-card {
    background: rgba(0, 0, 0, 0.55);
    border-radius: 100px;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    margin: 15px 0 20px;
    border: 1px solid #ff99cc;
  }

  .play-circle {
    width: 55px;
    height: 55px;
    background: radial-gradient(circle, #ff6a88, #ff2e63);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 28px;
    color: white;
    box-shadow: 0 0 12px #ff4d6d;
  }

  .wave-bars {
    flex: 1;
    height: 14px;
    background: repeating-linear-gradient(90deg, #ffb3c6, #ffb3c6 10px, #ff4d6d 10px, #ff4d6d 20px);
    border-radius: 20px;
  }

  .video-wrapper {
    margin: 12px 0 5px;
    display: flex;
    justify-content: center;
  }

  video {
    width: 90%;
    max-width: 330px;
    aspect-ratio: 9 / 16;
    object-fit: cover;
    border-radius: 38px;
    box-shadow: 0 18px 30px rgba(0,0,0,0.6), 0 0 0 3px #ff77aa;
    background: #1a001f;
  }

  .falling-heart {
    position: fixed;
    top: -50px;
    pointer-events: none;
    z-index: 2000;
    font-size: 28px;
    filter: drop-shadow(0 0 5px #ff2e5e);
    animation: fall linear forwards;
  }

  @keyframes fall {
    0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  .footer-note {
    font-size: 12px;
    margin-top: 20px;
    opacity: 0.7;
  }

  /* رسالة خطأ لو الملفات مش موجودة */
  .error-toast {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #ff3366cc;
    backdrop-filter: blur(10px);
    padding: 8px 16px;
    border-radius: 30px;
    font-size: 12px;
    z-index: 3000;
    display: none;
  }
</style>
</head>
<body>

<div id="startScreen">
  <img src="image.jpg" id="startImg" alt="صورتي" onerror="this.src='https://placehold.co/200x200/ff3388/white?text=❤️'">
  <button id="startBtn">✨ اضغط هنا ✨</button>
</div>

<audio id="bgMusic" src="vice1.mp3" loop preload="auto"></audio>
<audio id="voiceMsg" src="vice2.mp3" preload="auto"></audio>

<div class="glass-container">
  <img src="image.jpg" class="main-img" alt="حب" onerror="this.src='https://placehold.co/400x400/ff3388/white?text=💖'">

  <div class="message-area">
    <div id="typedText"></div>
  </div>

  <div class="counter-love" id="loveCounter">💞 0 يوم | 0 ساعة | 0 دقيقة | 0 ثانية</div>

  <div class="voice-card">
    <div class="play-circle" id="voicePlayBtn">🎤</div>
    <div class="wave-bars"></div>
    <div style="font-size: 14px;">♥ رسالة صوتية ♥</div>
  </div>

  <div class="video-wrapper">
    <video id="loveVideo" controls playsinline preload="metadata">
      <source src="video1.mp4" type="video/mp4">
      <source src="video1.mp4v" type="video/mp4">
      الفيديو مش مدعوم من المتصفح
    </video>
  </div>
  <div class="footer-note">🌹 كل لحظة معاكِ أغلى من أي حاجة 🌹</div>
</div>

<div id="errorToast" class="error-toast">⚠️</div>

<script>
(function() {
    const startScreen = document.getElementById('startScreen');
    const startBtn = document.getElementById('startBtn');
    const bgMusic = document.getElementById('bgMusic');
    const voiceAudio = document.getElementById('voiceMsg');
    const voicePlayBtn = document.getElementById('voicePlayBtn');
    const typedDiv = document.getElementById('typedText');
    const counterDiv = document.getElementById('loveCounter');
    const video = document.getElementById('loveVideo');
    const errorToast = document.getElementById('errorToast');

    const loveMessage = `💗 كل لحظة معاكِ أغلى من أي حاجة ❤️\nأنتِ مصدر سعادتي ودنياي 💖`;
    let charIndex = 0;
    let typingInterval = null;

    function showError(msg) {
        errorToast.textContent = msg;
        errorToast.style.display = 'block';
        setTimeout(() => { errorToast.style.display = 'none'; }, 4000);
    }

    // التحقق من وجود ملفات وسائط
    function checkMediaFiles() {
        // اختبار الصوت الخلفي
        fetch('vice1.mp3', { method: 'HEAD' }).catch(() => {
            showError('⚠️ ملف الموسيقى غير موجود: vice1.mp3');
        });
        fetch('vice2.mp3', { method: 'HEAD' }).catch(() => {
            showError('⚠️ ملف الرسالة الصوتية غير موجود: vice2.mp3');
        });
        fetch('video1.mp4', { method: 'HEAD' }).catch(() => {
            showError('⚠️ ملف الفيديو غير موجود: video1.mp4');
        });
    }

    function startTypingEffect() {
        typedDiv.innerHTML = '';
        charIndex = 0;
        if (typingInterval) clearTimeout(typingInterval);
        function typeNextChar() {
            if (charIndex < loveMessage.length) {
                let currentChar = loveMessage.charAt(charIndex);
                if (currentChar === '\n') {
                    typedDiv.innerHTML += '<br>';
                } else {
                    typedDiv.innerHTML += currentChar;
                }
                charIndex++;
                typingInterval = setTimeout(typeNextChar, 45);
            }
        }
        typeNextChar();
    }

    function initCounterAndUpdate() {
        const startDate = new Date(2025, 5, 2);
        function updateCounter() {
            const now = new Date();
            const diffMs = now - startDate;
            if (diffMs < 0) {
                counterDiv.innerHTML = `💖 في انتظار 2 يونيو 2025 💖`;
                return;
            }
            const totalSeconds = Math.floor(diffMs / 1000);
            const days = Math.floor(totalSeconds / 86400);
            const hours = Math.floor((totalSeconds % 86400) / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;
            counterDiv.innerHTML = `💖 ${days} يوم | ${hours} ساعة | ${minutes} دقيقة | ${seconds} ثانية 💖`;
        }
        updateCounter();
        setInterval(updateCounter, 1000);
    }

    let heartsInterval = null;
    function startFallingHearts() {
        if (heartsInterval) clearInterval(heartsInterval);
        heartsInterval = setInterval(() => {
            const heartDiv = document.createElement('div');
            heartDiv.classList.add('falling-heart');
            const heartSymbols = ['❤️', '💖', '💗', '💓', '💕', '💞', '💘', '💝', '❤️‍🔥'];
            heartDiv.innerHTML = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
            heartDiv.style.fontSize = (Math.floor(Math.random() * 30) + 24) + 'px';
            heartDiv.style.left = Math.random() * 100 + '%';
            const duration = (Math.random() * 3.5 + 2.2).toFixed(2);
            heartDiv.style.animation = `fall ${duration}s linear forwards`;
            document.body.appendChild(heartDiv);
            heartDiv.addEventListener('animationend', () => heartDiv.remove());
            setTimeout(() => heartDiv.remove(), duration * 1000 + 500);
        }, 150);
    }

    function playVoiceRecording() {
        if (!voiceAudio) return;
        const bg = bgMusic;
        let wasPlaying = false;
        if (!bg.paused) {
            wasPlaying = true;
            bg.volume = 0.2;
        }
        voiceAudio.currentTime = 0;
        voiceAudio.play().catch(err => {
            console.warn("الصوت:", err);
            showError('⚠️ فشل تشغيل الصوت - تأكد من ملف vice2.mp3');
            if (wasPlaying) bg.volume = 1.0;
        });
        voiceAudio.onended = () => {
            if (wasPlaying) bg.volume = 1.0;
            voiceAudio.onended = null;
        };
    }

    voicePlayBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        playVoiceRecording();
    });

    // محاولة إعادة تحميل الفيديو لو فشل
    if (video) {
        video.addEventListener('error', () => {
            showError('⚠️ فشل تحميل الفيديو - حاول مره أخرى أو تأكد من ملف video1.mp4');
        });
    }

    let isStarted = false;
    function startFullExperience() {
        if (isStarted) return;
        isStarted = true;

        startScreen.style.opacity = '0';
        setTimeout(() => {
            startScreen.style.display = 'none';
        }, 400);

        bgMusic.volume = 0.8;
        bgMusic.play().catch(e => {
            console.log("موسيقى:", e);
            showError('⚠️ فشل تشغيل الموسيقى - تأكد من ملف vice1.mp3');
        });

        startTypingEffect();
        initCounterAndUpdate();
        startFallingHearts();
        checkMediaFiles(); // فحص الملفات واعلام المستخدم
    }

    startBtn.addEventListener('click', (e) => {
        e.preventDefault();
        startFullExperience();
    });

    // ضمان استمرار القلوب
    setInterval(() => {
        if (isStarted && !heartsInterval) {
            startFallingHearts();
        }
    }, 5000);
})();
</script>
</body>
</html>
